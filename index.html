<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070910">
  <meta name="description" content="An animated neon mandala and helix turbine study in light and motion.">
  <title>Neon Field Studies</title>
  <style>
    :root{color-scheme:dark;--ink:#080a12;--paper:#dce5ef;--muted:#818ba0;--line:rgba(179,197,216,.16);--cyan:#54f3e5;--pink:#f466c6;--amber:#ffc96a;font-family:"Aptos","Segoe UI",sans-serif}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--paper)}body{display:grid;grid-template-rows:68px minmax(0,1fr) 82px;background:radial-gradient(ellipse at 50% 49%,rgba(35,29,54,.31),transparent 49%),linear-gradient(135deg,#090b13,#070910 54%,#0c0811)}.topbar,.controlbar{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,3vw,42px);background:rgba(7,9,16,.78);backdrop-filter:blur(14px)}.topbar{border-bottom:1px solid var(--line)}.controlbar{border-top:1px solid var(--line);gap:20px}.wordmark{display:flex;align-items:center;gap:12px;min-width:180px;color:var(--paper);font-family:Georgia,"Times New Roman",serif;font-size:15px;letter-spacing:.12em;text-decoration:none;white-space:nowrap}.sigil{width:26px;height:26px;border:1px solid rgba(84,243,229,.7);border-radius:50%;box-shadow:0 0 14px rgba(84,243,229,.22),inset 0 0 12px rgba(84,243,229,.12);position:relative}.sigil:before,.sigil:after{content:"";position:absolute;inset:5px;border:1px solid rgba(244,102,198,.75);border-radius:50% 0;transform:rotate(45deg)}.sigil:after{transform:rotate(-45deg);border-color:rgba(255,201,106,.72)}.edition{color:var(--muted);font:10px/1.2 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.1em;text-transform:uppercase}.scene-tabs{display:inline-flex;align-items:center;gap:4px;padding:4px;border:1px solid var(--line);border-radius:7px;background:rgba(18,21,31,.75)}button{border:0;color:var(--muted);background:transparent;font:inherit;cursor:pointer;transition:color .18s ease,background .18s ease,border-color .18s ease}button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}.scene-tab{min-height:34px;padding:0 14px;border-radius:4px;font-size:12px;letter-spacing:.02em}.scene-tab[aria-pressed=true]{color:#e8fffb;background:rgba(84,243,229,.12);box-shadow:inset 0 0 0 1px rgba(84,243,229,.22)}button:hover{color:#fff}.stage{position:relative;min-height:0;overflow:hidden;isolation:isolate}#scene{position:absolute;inset:0;display:block;width:100%;height:100%}.caption{position:absolute;z-index:1;top:clamp(24px,5vh,52px);left:clamp(20px,5vw,72px);pointer-events:none;animation:arrive .8s both}.index{margin:0 0 9px;color:var(--cyan);font:10px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.18em}h1{max-width:min(390px,80vw);margin:0;color:#e9e9ee;font:400 clamp(24px,3vw,38px)/1.08 Georgia,"Times New Roman",serif;letter-spacing:.01em;text-shadow:0 2px 24px rgba(0,0,0,.35)}.caption p:last-child{margin:9px 0 0;color:#9099ab;font:11px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase}.instrument{display:flex;align-items:center;gap:15px;min-width:250px}.wind-control{display:none;align-items:center;gap:10px;color:var(--muted);font:10px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.08em;white-space:nowrap}body[data-scene=turbine] .wind-control{display:flex}input[type=range]{width:clamp(78px,12vw,142px);accent-color:var(--cyan)}output{min-width:46px;color:var(--cyan);text-align:right}.commands{display:flex;align-items:center;gap:8px}.command{min-height:36px;padding:0 13px;border:1px solid var(--line);border-radius:5px;color:#b6bece;font-size:11px;letter-spacing:.03em}.command:hover{border-color:rgba(84,243,229,.48);color:#eafffd}.status{min-width:180px;color:#737e94;font:10px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.08em;text-align:right;text-transform:uppercase}.status:before{content:"";display:inline-block;width:6px;height:6px;margin:0 8px 1px 0;border-radius:50%;background:var(--cyan);box-shadow:0 0 9px var(--cyan)}body.is-paused .status:before{background:var(--amber);box-shadow:0 0 9px var(--amber)}@keyframes arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@media(max-width:700px){body{grid-template-rows:58px minmax(0,1fr) 118px}.wordmark{min-width:0;font-size:12px;gap:8px}.sigil{width:22px;height:22px}.edition{display:none}.topbar{padding:0 14px;gap:10px}.scene-tabs{gap:1px}.scene-tab{min-height:32px;padding:0 9px;font-size:11px}.caption{top:20px;left:18px}h1{font-size:25px}.caption p:last-child{font-size:9px}.controlbar{padding:12px 16px;flex-wrap:wrap;justify-content:center;gap:10px 18px}.instrument{min-width:0;justify-content:center}.status{display:none}.commands{justify-content:center}.wind-control{font-size:9px}}@media(max-width:390px){.wordmark span:last-child{display:none}.scene-tab{padding:0 7px}.command{padding:0 10px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important}}
  </style>
</head>
<body data-scene="flower">
  <header class="topbar">
    <a class="wordmark" href="#" aria-label="Neon Field Studies home"><span class="sigil" aria-hidden="true"></span><span>NEON FIELD STUDIES</span></a>
    <span class="edition">Light / Form / Motion &nbsp; No. 01</span>
    <nav class="scene-tabs" aria-label="Choose animation"><button class="scene-tab" type="button" data-scene-button="flower" aria-pressed="true">Mandala</button><button class="scene-tab" type="button" data-scene-button="turbine" aria-pressed="false">Turbine</button></nav>
  </header>
  <main class="stage">
    <canvas id="scene" aria-label="Animated neon mandala and helix turbine"></canvas>
    <section class="caption" aria-live="polite"><p class="index" id="scene-index">01 / 02</p><h1 id="scene-title">Mandala Bloom</h1><p id="scene-subtitle">Radial light study</p></section>
  </main>
  <footer class="controlbar">
    <div class="instrument">
      <label class="wind-control" for="wind">WIND <input id="wind" type="range" min="1" max="15" step="0.5" value="7.5" aria-label="Turbine wind speed"><output id="wind-value" for="wind">7.5 m/s</output></label>
      <div class="commands"><button class="command" id="toggle-motion" type="button">Pause</button><button class="command" id="reset-motion" type="button">Restart</button></div>
    </div>
    <div class="status" id="status" role="status">Animation running</div>
  </footer>
  <script>
    (()=>{
      const canvas=document.querySelector("#scene"),ctx=canvas.getContext("2d"),sceneButtons=[...document.querySelectorAll("[data-scene-button]")],title=document.querySelector("#scene-title"),subtitle=document.querySelector("#scene-subtitle"),indexLabel=document.querySelector("#scene-index"),toggleButton=document.querySelector("#toggle-motion"),resetButton=document.querySelector("#reset-motion"),windInput=document.querySelector("#wind"),windValue=document.querySelector("#wind-value"),status=document.querySelector("#status"),tau=Math.PI*2;
      const colors={blue:{fill:"rgba(4,29,62,.76)",glow:"#27cfff",line:"#a6f4ff",vein:"#51dfff"},violet:{fill:"rgba(37,17,72,.78)",glow:"#a34aff",line:"#e2baff",vein:"#bf8cff"},pink:{fill:"rgba(75,12,57,.78)",glow:"#ff4bb6",line:"#ffc0ec",vein:"#ff82d2"},red:{fill:"rgba(75,13,30,.82)",glow:"#ff465e",line:"#ffd0ba",vein:"#ff8793"}};
      let width=1,height=1,cx=0,cy=0,elapsed=0,lastTime=performance.now(),paused=false,scene="flower",wind=7.5;
      const random=mulberry32(2301),stars=Array.from({length:115},()=>({x:random(),y:random(),radius:random()>.83?1.6:.8,phase:random()*tau,strength:.35+random()*.65})),particles=Array.from({length:105},()=>({angle:random()*tau,radius:.58+random()*.63,speed:(.16+random()*.68)*(random()>.5?1:-1),size:.8+random()*2.2,phase:random()*tau,hue:[190,280,320,355][Math.floor(random()*4)]}));
      function mulberry32(seed){return function(){let value=seed+=0x6d2b79f5;value=Math.imul(value^value>>>15,value|1);value^=value+Math.imul(value^value>>>7,value|61);return((value^value>>>14)>>>0)/4294967296}}
      function resize(){const bounds=canvas.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);width=bounds.width;height=bounds.height;cx=width/2;cy=height/2;canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
      function glow(color,blur,draw){ctx.save();ctx.shadowColor=color;ctx.shadowBlur=blur;draw();ctx.restore()}
      function background(now){ctx.clearRect(0,0,width,height);const wash=ctx.createRadialGradient(cx,cy,12,cx,cy,Math.max(width,height)*.68);wash.addColorStop(0,"rgba(28,26,47,.28)");wash.addColorStop(.58,"rgba(13,16,29,.13)");wash.addColorStop(1,"rgba(3,5,12,0)");ctx.fillStyle=wash;ctx.fillRect(0,0,width,height);for(const star of stars){const pulse=.38+.62*(.5+.5*Math.sin(now*.0012+star.phase)),alpha=pulse*star.strength*.62;ctx.fillStyle=`rgba(190,205,230,${alpha})`;ctx.beginPath();ctx.arc(star.x*width,star.y*height,star.radius,0,tau);ctx.fill()}}
      function petalPath(length,halfWidth){ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(-halfWidth*.78,-length*.24,-halfWidth*.95,-length*.79,0,-length);ctx.bezierCurveTo(halfWidth*.95,-length*.79,halfWidth*.78,-length*.24,0,0);ctx.closePath()}
      function drawPetalLayer(count,length,halfWidth,palette,progress,phase=0,bend=0){const complete=progress*count;for(let i=0;i<Math.min(count,Math.ceil(complete));i++){const petalProgress=Math.min(1,complete-i),grownLength=length*petalProgress,grownWidth=halfWidth*Math.sqrt(petalProgress),angle=tau*i/count+phase;ctx.save();ctx.translate(cx,cy);ctx.rotate(angle);ctx.translate(bend*Math.sin(petalProgress*Math.PI)*.25,0);petalPath(grownLength,grownWidth);ctx.fillStyle=palette.fill;ctx.strokeStyle=palette.glow;ctx.lineWidth=2.4;glow(palette.glow,20,()=>{ctx.fill();ctx.stroke()});ctx.strokeStyle=palette.line;ctx.lineWidth=1.15;glow(palette.glow,8,()=>ctx.stroke());ctx.beginPath();ctx.moveTo(0,-grownLength*.08);ctx.quadraticCurveTo(0,-grownLength*.54,0,-grownLength*.91);ctx.strokeStyle=palette.vein;ctx.lineWidth=1;glow(palette.vein,8,()=>ctx.stroke());ctx.restore()}}
      function orbit(radius,color,phase,flatten=.56){ctx.beginPath();ctx.ellipse(cx,cy,radius,radius*flatten,phase,0,tau);ctx.strokeStyle=color;ctx.lineWidth=1;glow(color,12,()=>ctx.stroke())}
      function drawCenter(now){const pulse=1+.055*Math.sin(now*.0028),gradient=ctx.createRadialGradient(cx,cy,1,cx,cy,52*pulse);gradient.addColorStop(0,"rgba(255,255,255,1)");gradient.addColorStop(.12,"rgba(255,211,243,.98)");gradient.addColorStop(.34,"rgba(255,66,177,.86)");gradient.addColorStop(.7,"rgba(159,49,225,.32)");gradient.addColorStop(1,"rgba(159,49,225,0)");ctx.fillStyle=gradient;glow("#ff8bdf",35,()=>{ctx.beginPath();ctx.arc(cx,cy,52*pulse,0,tau);ctx.fill()});for(let i=0;i<12;i++){const angle=tau*i/12+now*.00012;ctx.beginPath();ctx.moveTo(cx+Math.cos(angle)*24,cy+Math.sin(angle)*24);ctx.lineTo(cx+Math.cos(angle)*48,cy+Math.sin(angle)*48);ctx.strokeStyle="#ffd2f2";ctx.lineWidth=1;glow("#ff74d3",10,()=>ctx.stroke())}}
      function drawParticles(now){const spread=Math.min(width,height)*.43;for(const particle of particles){const angle=particle.angle+elapsed*particle.speed,radius=spread*particle.radius,x=cx+Math.cos(angle)*radius,y=cy+Math.sin(angle)*radius,pulse=.55+.45*Math.sin(now*.004+particle.phase),size=particle.size*(.72+pulse*.7),color=`hsl(${particle.hue} 100% 69%)`;ctx.fillStyle=color;glow(color,12+size*2,()=>{ctx.beginPath();ctx.arc(x,y,size,0,tau);ctx.fill()});ctx.fillStyle="rgba(255,255,255,.82)";ctx.beginPath();ctx.arc(x,y,Math.max(.7,size*.34),0,tau);ctx.fill()}}
      function clamp(value){return Math.max(0,Math.min(1,value))}
      function drawFlower(now){const scale=Math.min(width,height)*.001;drawPetalLayer(16,236*scale,38*scale,colors.blue,clamp(elapsed/2.8),-Math.PI/2);drawPetalLayer(14,190*scale,34*scale,colors.violet,clamp((elapsed-1.7)/2.8),-Math.PI/2+Math.PI/14,4*scale);drawPetalLayer(12,145*scale,31*scale,colors.pink,clamp((elapsed-3.5)/2.5),-Math.PI/2,-3*scale);drawPetalLayer(10,99*scale,23*scale,colors.red,clamp((elapsed-5)/1.8),-Math.PI/2+Math.PI/10);if(elapsed>1.2)orbit(82*scale,"rgba(66,231,255,.75)",elapsed*.08);if(elapsed>3)orbit(119*scale,"rgba(185,112,255,.78)",-elapsed*.05);if(elapsed>5.5)orbit(157*scale,"rgba(255,94,201,.7)",elapsed*.035);if(elapsed>6.3)drawCenter(now);drawParticles(now)}
      function drawWind(now,speed){const step=Math.max(34,height/15);for(let i=0;i<25;i++){const x=((i*137-elapsed*(95+speed*11))%(width+160)+width+160)%(width+160)-80,y=(i*step*1.73+74)%(height-110)+55,length=(20+speed*2.1)*Math.min(width,height)*.001,alpha=.18+.19*(.5+.5*Math.sin(now*.002+i));ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-length,y);ctx.strokeStyle=`rgba(76,222,219,${alpha})`;ctx.lineWidth=1;glow("#46d8e4",7,()=>ctx.stroke())}}
      function project(fraction,angle,radius,rotorHeight){const depth=Math.sin(angle);return{x:cx+radius*Math.cos(angle),y:cy+fraction*rotorHeight-depth*radius*.34,depth}}
      function drawTurbine(now){const scale=Math.min(width,height)*.001,radius=132*scale,rotorHeight=322*scale,gust=wind+.8*Math.sin(elapsed*.7),angularSpeed=.18+gust*.12,angle=elapsed*(.18+wind*.12)+(.8*.12/.7)*(1-Math.cos(elapsed*.7));drawWind(now,gust);ctx.beginPath();ctx.ellipse(cx,cy,radius*1.38,rotorHeight*.56,0,0,tau);ctx.strokeStyle="rgba(79,114,125,.42)";ctx.lineWidth=1.5;ctx.stroke();const panels=[],sections=34,halfAngle=.39;for(let blade=0;blade<3;blade++){const bladePhase=tau*blade/3;for(let section=0;section<sections;section++){const y0=section/sections-.5,y1=(section+1)/sections-.5,a0=angle+(y0+.5)*tau*1.15+bladePhase,a1=angle+(y1+.5)*tau*1.15+bladePhase,points=[project(y0,a0-halfAngle,radius,rotorHeight),project(y0,a0+halfAngle,radius,rotorHeight),project(y1,a1+halfAngle,radius,rotorHeight),project(y1,a1-halfAngle,radius,rotorHeight)];panels.push({depth:points.reduce((sum,point)=>sum+point.depth,0)/points.length,points})}}panels.sort((a,b)=>a.depth-b.depth);for(const panel of panels){const brightness=(panel.depth+1)*.5,fill=`rgba(${13+brightness*17},${55+brightness*91},${65+brightness*42},.82)`,edge=`rgba(${86+brightness*139},${195+brightness*60},${208+brightness*44},.95)`;ctx.beginPath();ctx.moveTo(panel.points[0].x,panel.points[0].y);for(let i=1;i<panel.points.length;i++)ctx.lineTo(panel.points[i].x,panel.points[i].y);ctx.closePath();ctx.fillStyle=fill;ctx.strokeStyle=edge;ctx.lineWidth=1.1;glow("#42f2dc",9,()=>{ctx.fill();ctx.stroke()})}ctx.beginPath();ctx.moveTo(cx,cy-rotorHeight*.57);ctx.lineTo(cx,cy+rotorHeight*.57);ctx.strokeStyle="#8df8e8";ctx.lineWidth=Math.max(3,4*scale);glow("#4af4e1",16,()=>ctx.stroke());for(const y of[cy-rotorHeight*.57,cy+rotorHeight*.57]){ctx.beginPath();ctx.arc(cx,y,7*scale,0,tau);ctx.fillStyle="#d8fff1";ctx.fill()}const hub=ctx.createRadialGradient(cx,cy,1,cx,cy,25*scale);hub.addColorStop(0,"#fff");hub.addColorStop(.35,"#d7fff1");hub.addColorStop(1,"rgba(74,244,225,.12)");ctx.fillStyle=hub;glow("#54f3e5",20,()=>{ctx.beginPath();ctx.arc(cx,cy,23*scale,0,tau);ctx.fill()});const rpm=angularSpeed*60/tau;ctx.textAlign="center";ctx.fillStyle="#a4fff2";ctx.font="11px ui-monospace,monospace";ctx.fillText(`WIND  ${gust.toFixed(1)} m/s`,cx,height-48);ctx.fillStyle="#929db3";ctx.fillText(`ROTOR  ${rpm.toFixed(1)} RPM`,cx,height-27)}
      function updateScene(nextScene){scene=nextScene;document.body.dataset.scene=scene;sceneButtons.forEach(button=>button.setAttribute("aria-pressed",String(button.dataset.sceneButton===scene)));const isFlower=scene==="flower";title.textContent=isFlower?"Mandala Bloom":"Helix Turbine";subtitle.textContent=isFlower?"Radial light study":"Wind / rotation study";indexLabel.textContent=isFlower?"01 / 02":"02 / 02"}
      function togglePause(){paused=!paused;toggleButton.textContent=paused?"Resume":"Pause";status.textContent=paused?"Animation paused":"Animation running";document.body.classList.toggle("is-paused",paused)}
      function frame(now){const delta=Math.min((now-lastTime)/1000,.05);lastTime=now;if(!paused)elapsed+=delta;background(now);if(scene==="flower")drawFlower(now);else drawTurbine(now);requestAnimationFrame(frame)}
      sceneButtons.forEach(button=>button.addEventListener("click",()=>updateScene(button.dataset.sceneButton)));toggleButton.addEventListener("click",togglePause);resetButton.addEventListener("click",()=>{elapsed=0;paused=false;toggleButton.textContent="Pause";status.textContent="Animation running";document.body.classList.remove("is-paused")});windInput.addEventListener("input",()=>{wind=Number(windInput.value);windValue.value=`${wind.toFixed(1)} m/s`});window.addEventListener("resize",resize);window.addEventListener("keydown",event=>{if(event.target instanceof HTMLInputElement)return;if(event.code==="Space"){event.preventDefault();togglePause()}else if(event.key.toLowerCase()==="t")updateScene(scene==="flower"?"turbine":"flower");else if(event.key.toLowerCase()==="r")resetButton.click();else if(event.key==="ArrowUp"){windInput.value=String(Math.min(15,wind+.5));windInput.dispatchEvent(new Event("input"))}else if(event.key==="ArrowDown"){windInput.value=String(Math.max(1,wind-.5));windInput.dispatchEvent(new Event("input"))}});resize();requestAnimationFrame(frame)
    })();
  </script>
</body>
</html>
